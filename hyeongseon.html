<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>내 버킷리스트 카드</title>
    <style>
        /* 기본 카드 디자인 (자유롭게 수정 가능) */
        @import url('https://fonts.googleapis.com/css2?family=Cute+Font&family=Nanum+Brush+Script&display=swap');
 * {
                font-family: 'Cute Font', sans-serif;
                font-size: 20px;
            }

            .card {
                transform: rotate(0deg);
                width: 300px;
                margin: 50px auto;
                background: linear-gradient(135deg, #fffcf0 0%, #ff6f61 100%);
                padding: 15px 15px 35px 15px;
                border-radius: 2px 2px 15px 5px;
                box-shadow: 3px 5px 15px rgba(0, 0, 0, 0.15);
                transform: rotate(2deg);
                /* 배지의 기준점이 되기 위한 필수 속성 */
                position: relative;
            }

            .card img {
                width: 100%;
                height: 200px;
                object-fit: cover;
                border-radius: 5px;
                margin-bottom: 15px;
            }

            .card h2 {
                color: #2c3e50;
                font-size: 1.5rem;
                margin-bottom: 10px;
                text-align: center;
            }

            .card p {
                color: #444;
                font-size: 1.1rem;
                line-height: 1.5;
                text-align: center;
            }

            /* 1. 배지 (absolute) 관련 CSS를 작성하세요 */
            .badge {
                position: absolute;
                top: -5px;
                left: -15px;
                background-color: #de2aca;
                color: white;
                padding: 0px 15px;
                border-radius: 20%/50%;
                font-size: small;
                transform: rotate(-17deg);
            }

            .badge font {
                font-size: 1.1rem;
                font-weight: bold;
            }

            /* 2. 비밀 메모 (visibility) 및 hover 효과 관련 CSS를 작성하세요 */
            .secret-note {
                visibility: hidden;
                border-top: 2px dotted #cccccc;
            }

            .card:hover .secret-note {
                visibility: visible;
            }
    </style>
</head>

<body>
    <div class="card">
        <div class="badge">
            <font>Good</font>👍
        </div>
        <img src="https://i.namu.wiki/i/LRZ5ctQhLDCY8qpLGSHcGe9PWs_yRXaSNiLnQnL0EOlVbWw_PXv0d-
MtPpHeLg3aP7NynGoPnPGgoPmP5JntmG69JVJZ5kZIVa6SrOUj4uPwpngoHTsNFUEa2UcFUFKqp7pEx8Gem1Tc
gM4s0TOYEg.webp" alt="일본 여행 사진">
        <h2>✨ 형선의 꿈</h2>
        <p> ✈️1. 일주일동안 해외 여행 가기</p>
        <p> 🎮2. 게임 만들어 보기</p>
        <p class="secret-note">🤫 TMI: 도쿄는 가봤음</p>
    </div>
</body>

</html>
